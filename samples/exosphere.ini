[exosphere]
debugmode=1
; 用户态调试模式（0 = 关闭）
debugmode_user=0
; 禁用用户异常处理（0 = 保持启用）
disable_user_exception_handlers=0
; 允许用户态访问 PMU（0 = 禁止）
enable_user_pmu_access=0
; 8G 运存支持：零售机默认上限 4GB，开启后按物理容量自动选择（Hekate 引导项需同时设置 memmode=1）
enable_mem_mode=1
; 屏蔽序列号：sysMMC（真实破解系统）
blank_prodinfo_sysmmc=1
; 屏蔽序列号：emuMMC（虚拟破解系统）
blank_prodinfo_emummc=1
; 是否允许在 sysMMC 中写入 PRODINFO（官方强烈不建议开启）
allow_writing_to_cal_sysmmc=0
log_port=0
log_baud_rate=115200
log_inverted=0
